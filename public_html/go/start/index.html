<style>
  :root{ --brand:#ff6b35; --brand-dark:#e55d2a; --kakao:#FAE100; --kakao-text:#3c1e1e;
    --bg:#f4f5f7; --text:#1f2937; --muted:#6b7280; --line:#e9ebef; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Noto Sans KR",sans-serif;
    display:grid;place-items:center;padding:18px}
  .card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:18px;
    box-shadow:0 10px 34px rgba(17,24,39,.09);padding:22px 18px 18px}
  .logo{width:54px;height:54px;border-radius:13px;display:block;margin:0 auto 12px}
  h1{margin:0 0 4px;font-size:19px;text-align:center;font-weight:800;line-height:1.35}
  .lead{margin:0 0 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
  .lead b{color:var(--brand-dark)}

  .app-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;
    border-radius:13px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    font-size:15.5px;font-weight:800;text-decoration:none}
  .app-btn:active{transform:scale(.98)}
  .app-note{margin:8px 0 18px;text-align:center;font-size:11.5px;color:#9aa1ab}

  .div{display:flex;align-items:center;gap:10px;color:#aeb4bd;font-size:12px;font-weight:700;margin:4px 0 14px}
  .div::before,.div::after{content:"";flex:1;height:1px;background:var(--line)}

  .rooms{display:flex;flex-direction:column;gap:9px}
  .room{display:flex;align-items:center;gap:12px;text-decoration:none;border:1px solid var(--line);
    border-radius:13px;padding:13px 14px;background:#fffdf2;transition:.12s}
  .room:active{transform:scale(.99)}
  .room .em{width:38px;height:38px;border-radius:10px;background:var(--kakao);display:grid;place-items:center;font-size:19px;flex:none}
  .room .tx{flex:1}
  .room .tt{font-size:14.5px;font-weight:800;color:#1f2937}
  .room .ts{font-size:11.5px;color:var(--muted);margin-top:1px}
  .room .ar{color:#c2c7cf;font-size:18px;font-weight:700}

  .foot{margin-top:16px;text-align:center;font-size:11px;color:#aab0b9;line-height:1.6}

    <a class="room" href="https://open.kakao.com/o/g4dOjSji" onclick="track('kakao_realestate')">
